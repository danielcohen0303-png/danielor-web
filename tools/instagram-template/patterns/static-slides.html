<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:K;font-weight:700;src:url(../ogfonts/node_modules/@fontsource/karantina/files/karantina-hebrew-700-normal.woff2)}
@font-face{font-family:K;font-weight:700;src:url(../ogfonts/node_modules/@fontsource/karantina/files/karantina-latin-700-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:R;font-weight:500;src:url(../ogfonts/node_modules/@fontsource/rubik/files/rubik-hebrew-500-normal.woff2)}
@font-face{font-family:R;font-weight:500;src:url(../ogfonts/node_modules/@fontsource/rubik/files/rubik-latin-500-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:R;font-weight:400;src:url(../ogfonts/node_modules/@fontsource/rubik/files/rubik-hebrew-400-normal.woff2)}
@font-face{font-family:R;font-weight:400;src:url(../ogfonts/node_modules/@fontsource/rubik/files/rubik-latin-400-normal.woff2);unicode-range:U+0000-00FF}
html,body{margin:0;background:#f6f1fb}
.c{width:1080px;height:1350px;position:relative;overflow:hidden;background:#f6f1fb}
.c::before{content:"";position:absolute;inset:0;background:
 radial-gradient(620px 520px at 104% 4%,rgba(255,47,200,.30),transparent 66%),
 radial-gradient(560px 560px at -8% 46%,rgba(67,240,255,.26),transparent 66%),
 radial-gradient(760px 480px at 60% 108%,rgba(139,61,255,.20),transparent 68%)}
.head{position:absolute;top:42px;left:0;right:0;text-align:center}
.kick{display:table;margin:0 auto;font-family:R;font-weight:500;font-size:34px;line-height:40px;letter-spacing:.02em;color:#1d1033;padding:6px 26px 8px;border-radius:999px;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#ff2fc8,#8b3dff) border-box;border:3px solid transparent;box-shadow:0 6px 14px -9px rgba(139,61,255,.55)}
h1{margin:6px 0 0;font-family:K;font-weight:700;font-size:118px;line-height:.92;color:#1d1033;letter-spacing:.01em}
h1 span{background:linear-gradient(90deg,#ff2fc8,#8b3dff);-webkit-background-clip:text;background-clip:text;color:transparent}
/* the video sits in this card; its inner box is 540x960 at (270,300) */
.glow{position:absolute;left:190px;top:330px;width:700px;height:930px;border-radius:80px;
 background:radial-gradient(50% 50% at 50% 50%,rgba(255,47,200,.30),rgba(139,61,255,.16) 55%,transparent 75%);filter:blur(40px)}
.card{position:absolute;left:264px;top:294px;width:552px;height:972px;border-radius:40px;padding:6px;box-sizing:border-box;
 background:linear-gradient(140deg,#ff2fc8,#8b3dff);box-shadow:0 40px 80px -30px rgba(61,20,110,.55),0 10px 30px -10px rgba(61,20,110,.30)}
.card i{display:block;width:540px;height:960px;border-radius:34px;background:#120b1f;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.foot{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-family:R;font-weight:500;font-size:26px;color:#5f5480;letter-spacing:.04em}
/* last slide */
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sign{position:relative;width:760px}
.sign img{display:block;width:100%}
.sign::before{content:"";position:absolute;inset:-18% -10%;background:radial-gradient(42% 46% at 62% 52%,rgba(255,47,200,.28),transparent 70%),radial-gradient(40% 50% at 30% 50%,rgba(139,61,255,.18),transparent 70%);z-index:-1}
.end p{position:relative;margin:26px 0 0;font-family:R;font-weight:400;font-size:38px;line-height:1.45;color:#3a2d57;text-align:center}
.pill{position:relative;margin-top:56px;padding:22px 64px;border-radius:999px;font-family:R;font-weight:500;font-size:44px;color:#1d1033;
 background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#ff2fc8,#8b3dff) border-box;border:4px solid transparent;box-shadow:0 24px 50px -24px rgba(139,61,255,.6);direction:ltr}
.sub{position:relative;margin-top:22px;font-family:R;font-weight:500;font-size:28px;color:#5f5480}

.note{position:absolute;left:90px;right:90px;top:50%;transform:translateY(-52%);background:rgba(255,255,255,.86);border-radius:44px;padding:64px 64px 58px;
 box-shadow:0 40px 90px -40px rgba(61,20,110,.45),0 0 0 1px rgba(203,187,232,.6)}
.who{display:flex;align-items:center;gap:24px}
.who img{width:120px;height:120px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px #fff,0 0 0 8px #ff2fc8}
.who b{display:block;font-family:R;font-weight:500;font-size:40px;color:#1d1033}
.who span{display:block;font-family:R;font-weight:400;font-size:28px;color:#5f5480;margin-top:4px}
.note p{margin:44px 0 0;font-family:R;font-weight:500;font-size:58px;line-height:1.36;color:#1d1033}
.note p em{font-style:normal;background:linear-gradient(90deg,#ff2fc8,#8b3dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.swipe{position:absolute;bottom:64px;left:0;right:0;text-align:center;font-family:R;font-weight:500;font-size:30px;color:#5f5480;letter-spacing:.04em}
.endh{position:relative;margin:0 0 30px;font-size:104px;text-align:center}
</style></head><body><div class="c" id="c"></div>
<script>
const q = new URLSearchParams(location.search);
const S = {
  car:{k:'פרסומת לרכב',t:'בלי יום <span>צילום אחד</span>'},
  agent:{k:'סוכן וואטסאפ לעסק',t:'עונה גם <span>ב־2 בלילה</span>'},
  recipe:{k:'סרטון מתכון',t:'מהמטבח <span>לרילס</span>'},
  fashion:{k:'קמפיין אופנה',t:'קולקציה <span>על דוגמן</span>'},
  me:{k:'בשנה וחצי האחרונות',t:'למדתי ובניתי <span>המון עם AI</span>',f:'הנה כמה מהם ←'},
  reel:{k:'סרטונים',t:'בלי מצלמה, <span>בלי סט</span>'},
  agent2:{k:'סוכני וואטסאפ',t:'עונים גם <span>ב־2 בלילה</span>'},
  web:{k:'אתרים',t:'כמו זה <span>שבניתי לעצמי</span>'}
};
const id = q.get('s'), c = document.getElementById('c');
if (id === 'cover') {
  c.innerHTML = '<div class="note"><div class="who"><img src="out/avatar.png"><div><b>דניאל כהן</b><span>Danielor AI</span></div></div>' +
    '<p>בשנה וחצי האחרונות למדתי ובניתי המון דברים עם AI.<br><em>הנה כמה מהם.</em></p></div>' +
    '<div class="swipe">החליקו ←</div>';
} else if (id === 'end') {
  c.innerHTML = '<div class="end"><h1 class="endh">עכשיו זה פתוח <span>גם לכם.</span></h1><div class="sign"><img src="../danielor/sign.webp"></div>' +
    '<p>סרטונים ועריכה, סוכני וואטסאפ,<br>אתרים ומצגות. לעסקים ולפרטיים.</p>' +
    '<div class="pill">danielor.ai</div><div class="sub">הקישור בביו</div></div>';
} else {
  const s = S[id], poster = q.get('p');
  c.innerHTML = '<div class="head"><p class="kick">' + s.k + '</p><h1>' + s.t + '</h1></div>' +
    '<div class="glow"></div><div class="card"><i>' + (poster ? '<img src="' + poster + '">' : '') + '</i></div>' +
    '<div class="foot">' + (s.f || 'danielor.ai') + '</div>';
}
document.fonts.ready.then(() => { window.__ready = true; });
</script></body></html>

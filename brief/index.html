<title>Danielor · בריף אישי</title>

<style>
:root{
  color-scheme: light;
  --wall:#f6f1fb; --panel:#ffffff; --panel-2:#f1eafa; --line:#e2d7f2; --line-2:#cbbbe8;
  --fg:#1d1033; --muted:#5f5480; --dim:#6f6590;
  --pink:#d9109a; --pink-hot:#ff2fc8; --violet:#8b3dff; --pink-glow:rgba(255,47,200,.30); --pink-soft:rgba(217,16,154,.08);
  --cyan:#0a7f91; --cyan-soft:rgba(10,143,163,.08); --volt:#ecff52; --volt-edge:#c9e000;
  --grad:linear-gradient(90deg,#ff2fc8,#8b3dff);
  --bad:#ff6b8b;
  --display:'Karantina','Rubik',system-ui,sans-serif;
  --body:'Rubik','Heebo','Arial Hebrew',system-ui,sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--wall); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.6;
  padding:0 max(16px, env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background-image:
    radial-gradient(34rem 24rem at 95% -4%, rgba(255,47,200,.36), transparent 62%),
    radial-gradient(30rem 26rem at -8% 38%, rgba(67,240,255,.32), transparent 62%),
    radial-gradient(34rem 24rem at 55% 105%, rgba(139,61,255,.22), transparent 65%);
  background-attachment:fixed;
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
.wrap{max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px;max-width:640px;margin:0 auto}
.logo{font-family:var(--display);font-weight:700;font-size:2.3rem;line-height:1;letter-spacing:.06em;direction:ltr;color:var(--fg);
  text-shadow:0 0 16px rgba(255,47,200,.28)}
.logo span{color:var(--pink-hot);text-shadow:0 0 14px rgba(255,47,200,.45)}
.tag{font-size:.8rem;color:var(--muted);border:1px solid var(--line-2);background:rgba(255,255,255,.6);border-radius:99px;padding:3px 12px}
.loading{padding:30vh 0;text-align:center;color:var(--muted)}

/* hero */
.hero{padding:20px 0 8px}
.hi{color:var(--muted);margin:0 0 2px;font-size:1.05rem}
h1{font-family:var(--display);font-weight:700;font-size:clamp(3rem,2.2rem + 4vw,4.6rem);line-height:.95;margin:0 0 12px;letter-spacing:.01em}
h1 em{font-style:normal;color:var(--pink);background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.intro{color:var(--muted);margin:0;max-width:52ch}
.banner{margin:16px 0 0;padding:12px 14px;border-radius:12px;border:1px solid rgba(10,143,163,.35);background:var(--cyan-soft);font-size:.95rem}
.banner.warn{border-color:var(--volt-edge);background:rgba(236,255,82,.22)}

/* checklist */
.check{margin:22px 0 8px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:0 10px 30px rgba(70,30,120,.06)}
.check h2{margin:0 0 10px;font-size:1rem;font-weight:700}
.check ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.check li a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);padding:6px 4px;border-radius:10px}
.check li a:hover{background:var(--panel-2)}
.dot{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.75rem;color:var(--muted)}
.done .dot{background:var(--volt);border-color:var(--volt-edge);color:#111}
.opt{color:var(--dim);font-size:.85rem}

/* sections */
.sec{margin:16px 0;padding:20px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:0 10px 30px rgba(70,30,120,.06);scroll-margin-top:16px;transition:border-color .3s, box-shadow .3s}
.sec.flash{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.sec-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:var(--panel-2);border:1px solid var(--line)}
.sec.ok .num{background:var(--volt);color:#111;border-color:var(--volt-edge)}
.sec h3{margin:0;font-size:1.2rem;line-height:1.3}
.sec .sub{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.field{margin:18px 0 0}
.field:first-of-type{margin-top:4px}
.lbl{display:block;font-weight:500;margin-bottom:6px}
.req{color:var(--pink);margin-inline-start:2px}
.hint{display:block;color:var(--dim);font-size:.85rem;margin:-2px 0 8px}
input[type=text],input[type=url],input[type=date],textarea{
  width:100%;background:#fbf8fe;border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;font-size:16px;
  transition:border-color .2s
}
input:focus,textarea:focus{border-color:var(--pink);outline:none;box-shadow:0 0 0 3px var(--pink-soft)}
textarea{min-height:96px;resize:vertical}
input[type=date]{color-scheme:light;min-height:48px}
input::placeholder,textarea::placeholder{color:#958bb0}
input:disabled,textarea:disabled{opacity:.6}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:99px;padding:9px 16px;cursor:pointer;min-height:44px;transition:all .15s}
.chip:hover{border-color:var(--pink)}
.chip[aria-pressed=true]{border-color:var(--pink);background:var(--pink-soft);color:var(--pink);font-weight:500;box-shadow:0 0 14px rgba(255,47,200,.18)}
.cards{display:grid;gap:8px}
.card{text-align:start;border:1px solid var(--line-2);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;transition:all .15s}
.card b{display:block;font-weight:700}
.card span{display:block;color:var(--muted);font-size:.88rem}
.card[aria-pressed=true]{border-color:var(--pink);background:var(--pink-soft)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.icard{position:relative;border:2px solid transparent;border-radius:14px;overflow:hidden;padding:0;cursor:pointer;background:var(--panel-2);aspect-ratio:3/4}
.icard img,.icard video{width:100%;height:100%;object-fit:cover;display:block}
.icard span{position:absolute;inset:auto 0 0 0;padding:28px 10px 9px;font-size:.85rem;font-weight:500;line-height:1.25;color:#fff;background:linear-gradient(transparent,rgba(20,8,40,.88))}
.icard.noimg{aspect-ratio:auto;min-height:70px;display:grid;place-content:center;gap:6px;border-color:var(--line);background:linear-gradient(160deg,var(--panel-2),var(--wall))}
.icard.noimg i{font-style:normal;font-size:1.8rem;line-height:1}
.icard.noimg span{position:static;background:none;padding:0 10px;color:var(--fg)}
.icard[aria-pressed=true]{border-color:var(--pink);box-shadow:0 0 18px var(--pink-glow)}
.icard[aria-pressed=true]::after{content:"✓";position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}

.emos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ecard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;border:1px solid var(--line-2);border-radius:14px;padding:14px 12px;cursor:pointer;
  background:linear-gradient(160deg,#fff,var(--panel-2));min-height:96px;transition:all .15s}
.ecard i{font-style:normal;font-size:1.7rem;line-height:1}
.ecard span{font-size:.92rem;font-weight:500;line-height:1.3}
.ecard:hover{border-color:var(--pink)}
.ecard[aria-pressed=true]{border-color:var(--pink);background:linear-gradient(160deg,rgba(255,47,200,.14),#fff);box-shadow:0 0 16px rgba(255,47,200,.22)}
.ecard[aria-pressed=true]::after{content:"✓";position:absolute;top:10px;left:10px;width:24px;height:24px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem}

/* files */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ftile{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;text-align:center}
.ftile img{width:100%;height:100%;object-fit:cover}
.ftile .ic{font-size:1.6rem;line-height:1}
.ftile .nm{position:absolute;inset:auto 0 0 0;font-size:.68rem;padding:3px 6px;color:#fff;background:rgba(20,8,40,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
.ftile .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;color:#fff;background:rgba(20,8,40,.8);cursor:pointer;font-size:.9rem;line-height:1}
.ftile .pg{position:absolute;inset:auto 6px 6px 6px;height:5px;border-radius:9px;background:rgba(29,16,51,.15);overflow:hidden}
.ftile .pg i{display:block;height:100%;width:0;background:var(--cyan);transition:width .2s}
.add{border:1.5px dashed var(--line-2);background:transparent;cursor:pointer;color:var(--muted);font-size:.85rem;gap:2px;align-content:center}
.add b{font-size:1.5rem;font-weight:400;color:var(--pink)}
.add:hover{border-color:var(--pink);color:var(--fg)}
.fcount{color:var(--dim);font-size:.82rem;margin-top:6px}

/* people */
.person{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbf8fe;margin-bottom:10px}
.person-h{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.person-h input{flex:1;padding:9px 12px}
.person-h .rm{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--muted);font-size:.85rem}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;aspect-ratio:3/4;border-radius:12px;border:1.5px dashed var(--line-2);background:#fff;cursor:pointer;overflow:hidden;display:grid;place-items:center;padding:6px;color:var(--muted);font-size:.78rem;line-height:1.3;text-align:center}
.slot:hover{border-color:var(--pink);color:var(--fg)}
.slot svg{width:34px;height:34px;opacity:.55;margin:0 auto 4px;display:block}
.slot.has{border-style:solid;border-color:var(--volt-edge);padding:0}
.slot.has img{width:100%;height:100%;object-fit:cover}
.slot .lab{position:absolute;inset:auto 0 0 0;padding:16px 4px 5px;font-size:.72rem;color:#fff;background:linear-gradient(transparent,rgba(20,8,40,.85))}
.slot .pg{position:absolute;inset:auto 8px 8px 8px;height:5px;border-radius:9px;background:rgba(29,16,51,.15);overflow:hidden}
.slot .pg i{display:block;height:100%;width:0;background:var(--cyan);transition:width .2s}
.more{width:100%;border:1.5px dashed var(--line-2);background:transparent;border-radius:12px;padding:12px;cursor:pointer;color:var(--muted)}
.more:hover{border-color:var(--pink);color:var(--fg)}
.note{display:flex;gap:8px;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--panel-2);color:var(--muted);font-size:.88rem}

/* bottom bar */
.bar{position:fixed;inset:auto 0 0 0;z-index:5;box-shadow:0 -10px 30px rgba(70,30,120,.08);background:rgba(255,255,255,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left))}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.prog{flex:1;min-width:0}
.prog-t{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.prog-b{height:6px;border-radius:9px;background:var(--panel-2);overflow:hidden}
.prog-b i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .4s}
.send{flex:none;border:0;border-radius:12px;padding:13px 20px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff2fc8,#8b3dff);box-shadow:0 8px 24px rgba(200,40,200,.32);min-height:48px}
.send[aria-disabled=true]{background:var(--panel-2);color:var(--muted);box-shadow:none}
.send:disabled{opacity:.6;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:6;
  max-width:min(92vw,560px);background:#1d1033;color:#fff;border:1px solid #1d1033;border-radius:12px;padding:10px 16px;font-size:.92rem;transition:all .25s;box-shadow:0 10px 30px rgba(40,10,70,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* done */
.donebox{text-align:center;padding:12vh 0 4vh}
.big-ok{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--volt);color:#111;font-size:2.4rem;font-weight:700;box-shadow:0 0 40px rgba(236,255,82,.35);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.donebox p{color:var(--muted);max-width:44ch;margin:0 auto 18px}
.ghost{border:1px solid var(--line-2);background:#fff;border-radius:12px;padding:11px 18px;cursor:pointer}
.foot{color:var(--dim);font-size:.8rem;text-align:center;margin:28px 0 0}
.foot a,.help{color:var(--cyan)}
.help{display:inline-block;margin-top:8px;font-size:.88rem;text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    document.getElementById("bar").hidden = true;
    app.innerHTML = "";
    app.appendChild(el("section", { class: "donebox" }, [el("h1", { text: title }), el("p", { text: text })]));
  }

  window.addEventListener("beforeunload", function (e) {
    if (Object.keys(S.uploads).length) { e.preventDefault(); e.returnValue = ""; }
  });

  if (!token) {
    showError("בריף אישי", "את הדף הזה פותחים מהקישור האישי שקיבלתם מאיתנו בוואטסאפ.");
    return;
  }
  api("").then(function (d) {
    S.tpl = d.template; S.answers = d.answers || {}; S.files = d.files || []; S.status = d.status; S.locked = !!d.locked; S.name = d.name;
    document.title = "Danielor · " + S.tpl.title;
    renderForm();
  }).catch(function (e) {
    showError("הקישור לא נמצא", "כדאי לוודא שהקישור הועתק במלואו מהוואטסאפ. אם זה לא עוזר, כתבו לנו שם ונשלח קישור חדש.");
  });
})();
</script>
</body>
</html>

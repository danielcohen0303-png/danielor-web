<title>Danielor · מרכז הבקרה</title>
<style>
@font-face{font-family:'Rubik';font-weight:400;font-display:swap;src:url(/app/f/rubik-he-400.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-weight:500;font-display:swap;src:url(/app/f/rubik-he-500.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-weight:700;font-display:swap;src:url(/app/f/rubik-he-700.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-weight:400;font-display:swap;src:url(/app/f/rubik-la-400.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Rubik';font-weight:500;font-display:swap;src:url(/app/f/rubik-la-500.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Rubik';font-weight:700;font-display:swap;src:url(/app/f/rubik-la-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Karantina';font-weight:700;font-display:swap;src:url(/app/f/karantina-he-700.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Karantina';font-weight:700;font-display:swap;src:url(/app/f/karantina-la-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{
  --wall:#f6f1fb; --card:#fff; --soft:#f1eafa; --line:#e6dcf3; --line-2:#cbbbe8;
  --ink:#1d1033; --muted:#5f5480; --dim:#7a7098;
  --pink:#d9109a; --hot:#ff2fc8; --violet:#8b3dff; --violet-ink:#5b1fd1; --violet-soft:#efe5ff; --pink-soft:#ffe6f6;
  --green:#127a48; --green-soft:#e2f6ea; --amber:#9a5b00; --amber-soft:#fff1d6; --red:#c0263f; --red-soft:#fde8ec;
  --b-d:#d9109a; --b-he:#a8761c; --b-en:#2f5bd3; --b-g:#6c6479;
  --grad:linear-gradient(90deg,#ff2fc8,#8b3dff);
  --shadow:0 22px 44px -32px rgba(61,20,110,.55),0 2px 6px -4px rgba(61,20,110,.18);
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --font:'Rubik','Heebo','Arial Hebrew',system-ui,sans-serif; --display:'Karantina','Rubik',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:var(--wall)}
body{margin:0;min-height:100vh;background:var(--wall);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 38% at 100% 0%,rgba(255,47,200,.16),transparent 70%),radial-gradient(55% 34% at 0% 4%,rgba(139,61,255,.14),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:12px}
.app{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:0 16px calc(96px + var(--bot))}
/* header */
.hdr{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(10px + var(--top)) 16px 10px;display:flex;align-items:center;gap:10px;
  background:rgba(246,241,251,.78);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid transparent;transition:border-color .2s}
.hdr.scrolled{border-bottom-color:var(--line)}
.logo{display:flex;align-items:center;gap:8px;direction:ltr;font-weight:700;font-size:17px;letter-spacing:.14em}
.logo img{width:30px;height:30px;border-radius:9px;box-shadow:0 6px 16px -8px rgba(217,16,154,.8)}
.logo .e{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr .sp{flex:1}
.fresh{font-size:12px;color:var(--dim);white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink);flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* page titles */
.ptitle{margin:14px 0 2px;font-family:var(--display);font-weight:700;font-size:50px;line-height:.92;letter-spacing:.005em}
.ptitle span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.psub{margin:4px 0 18px;color:var(--muted);font-size:14px}
.view{display:flex;flex-direction:column}
h2.sec{margin:26px 0 10px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
h2.sec small{font-weight:400;color:var(--dim);font-size:13px}
.pill{display:inline-flex;align-items:center;min-width:22px;height:22px;padding:0 8px;border-radius:999px;background:var(--grad);color:#fff;font-size:12px;font-weight:700;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
/* hero */
.hero{position:relative;padding:20px 20px 18px;border-radius:26px;border:1.5px solid transparent;
  background:linear-gradient(135deg,#fff 0%,#fbf5ff 55%,#fff0fa 100%) padding-box,var(--grad) border-box;box-shadow:0 26px 50px -34px rgba(139,61,255,.75)}
.hero h1{margin:0;font-family:var(--display);font-weight:700;font-size:40px;line-height:.95}
.hero p{margin:8px 0 0;font-size:15px;color:var(--muted)}
.hero p b{color:var(--ink);font-weight:500}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 11px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:13px;font-weight:500;text-align:center;box-shadow:var(--shadow)}
.qa i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;background:var(--grad)}
.qa i svg{width:21px;height:21px}
.qa.ceo i{background:linear-gradient(135deg,#1d1033,#4b2a7a)}
.qa.wa i{background:linear-gradient(135deg,#13a05c,#0d7a46)}
/* waiting list */
.wait{display:flex;flex-direction:column;gap:10px}
.witem{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:start;width:100%}
.witem .wthumb{width:52px;height:64px;border-radius:12px;background:var(--soft) center/cover no-repeat;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.witem .wthumb.ph{display:grid;place-items:center;color:var(--violet)}
.witem .wthumb.ph svg{width:24px;height:24px}
.witem .wb{flex:1;min-width:0}
.witem b{display:block;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.witem small{display:block;color:var(--muted);font-size:13px}
.witem .why{color:var(--pink);font-weight:500;font-size:13px}
.witem .go{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet-ink)}
.witem .go svg{width:16px;height:16px}
.allgood{display:flex;align-items:center;gap:12px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.allgood i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green);flex:none}
.allgood i svg{width:18px;height:18px}
/* schedule */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-2px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%}
.sched{padding:6px 14px}
.day{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .dn{width:58px;flex:none}
.day .dn b{display:block;font-weight:700;font-size:15px;line-height:1.2}
.day .dn small{color:var(--dim);font-size:12px}
.day.today .dn b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.day .its{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.day .none{color:var(--dim);font-size:13px;padding-top:2px}
.ev{display:flex;align-items:center;gap:8px;width:100%;text-align:start;padding:7px 10px;border-radius:12px;background:var(--soft);font-size:14px}
.ev i{width:8px;height:8px;border-radius:50%;flex:none}
.ev .t{font-variant-numeric:tabular-nums;font-weight:500;color:var(--muted);font-size:13px;flex:none}
.ev .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .s{font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:999px;flex:none;white-space:nowrap}
.s-ok{background:var(--green-soft);color:var(--green)}
.s-wait{background:var(--pink-soft);color:var(--pink)}
.s-work{background:var(--violet-soft);color:var(--violet-ink)}
.s-fix{background:var(--amber-soft);color:var(--amber)}
.s-dim{background:#eee9f5;color:var(--muted)}
.nodate{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.nodate span.c{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink)}
/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px}
.stat h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--muted)}
.nums{display:flex;gap:14px}
.nums div{display:flex;flex-direction:column}
.nums b{font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.nums small{font-size:11.5px;color:var(--dim)}
.nums .hot b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bars{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:10px;direction:ltr}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(0deg,#c9b3f5,#8b3dff);min-height:3px}
.bars div.today i{background:var(--grad)}
.bars small{font-size:10px;color:var(--dim);line-height:1}
.mode-chip{display:inline-block;margin-top:8px;font-size:11.5px;padding:2px 9px;border-radius:999px}
/* content */
.item{display:flex;flex-direction:column;gap:12px;padding:16px;margin-bottom:16px;scroll-margin-top:calc(70px + var(--top))}
.ihead{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ihead h3{margin:0 0 2px;font-size:19px;font-weight:700;flex:1 1 100%;line-height:1.25}
.chip{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.idea{margin:0;color:var(--muted);font-size:14px}
.ig{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.igh{display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{width:34px;height:34px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#ffb347,#ff2fc8,#8b3dff);flex:none}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #fff;display:block}
.igh b{font-size:14px;font-weight:500}
.stage{position:relative;background:#000}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;direction:ltr;aspect-ratio:4/5}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;position:relative;aspect-ratio:4/5}
.slide video,.slide img{width:100%;height:100%;object-fit:cover;display:block}
.ctr{position:absolute;top:12px;right:12px;padding:3px 9px;border-radius:999px;background:rgba(20,16,28,.7);color:#fff;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.snd{position:absolute;bottom:12px;left:12px;width:34px;height:34px;border-radius:50%;background:rgba(20,16,28,.66);color:#fff;display:grid;place-items:center}
.snd svg{width:17px;height:17px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.88);color:#16111f;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.nav svg{width:14px;height:14px}
.nav.prev{left:10px}.nav.next{right:10px}
.nav[disabled]{opacity:0;pointer-events:none}
@media (hover:none){.nav{display:none}}
.igbar{display:flex;align-items:center;padding:8px 12px 0;position:relative;min-height:40px}
.igbar .ic{display:flex;gap:14px}
.igbar svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linejoin:round}
.igbar .sv{margin-inline-start:auto}
.dots{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px;direction:ltr}
.dots i{width:6px;height:6px;border-radius:50%;background:#c9c2d4;transition:background .2s}
.dots i.on{background:#2f6bff}
.cap{padding:6px 12px 14px;font-size:14px}
.cap .txt{white-space:pre-line}
.cap .txt.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap b{font-weight:500}
.cap button{color:var(--dim);font-size:14px}
.story{position:relative;width:min(100%,330px);aspect-ratio:9/16;margin:0 auto;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 22px 44px -26px rgba(40,10,80,.6)}
.story video{width:100%;height:100%;object-fit:cover;display:block}
.story .sbar{position:absolute;top:10px;left:10px;right:10px;height:3px;border-radius:3px;background:rgba(255,255,255,.4);overflow:hidden}
.story .sbar b{display:block;height:100%;width:0;background:#fff}
.story .sh{position:absolute;top:20px;right:12px;left:12px;display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.story .sh img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid #fff}
.story .sh span{opacity:.8;font-weight:400}
.act{display:flex;flex-direction:column;gap:10px;padding-top:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-weight:500;font-size:16px;flex:1 1 0;white-space:nowrap}
.btn.primary{border:0;background:var(--grad);color:#fff;box-shadow:0 12px 26px -14px rgba(139,61,255,.95)}
.btn.ghost{flex:0 0 auto;border-color:transparent;background:transparent;color:var(--muted);min-height:40px;padding:0 10px}
.btn[disabled]{opacity:.55}
.act form{display:flex;flex-direction:column;gap:8px;margin:0}
.act label{font-size:14px;font-weight:500}
.act textarea{width:100%;min-height:92px;resize:vertical;padding:12px 14px;border-radius:16px;border:1px solid var(--line-2);background:var(--soft);color:var(--ink);font:400 16px/1.45 var(--font)}
.msg{margin:0;font-size:14px;color:var(--muted)}
.msg.ok{color:var(--green)}
.msg b{color:var(--ink);font-weight:500}
.later{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:14px}
.lrow i{width:8px;height:8px;border-radius:50%;flex:none}
.lrow .n{flex:1;min-width:0}
.lrow .n small{display:block;color:var(--dim);font-size:12px}
.lrow .d{color:var(--muted);font-size:12.5px;white-space:nowrap}
/* team */
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cnt{padding:12px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center}
.cnt b{display:block;font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.cnt small{font-size:11.5px;color:var(--muted)}
.cnt.zero b{color:#c9c2d4}
.cnt.hot b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.group h4{margin:16px 0 8px;font-size:13px;font-weight:500;color:var(--dim)}
.trow{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.trow i{width:8px;height:8px;border-radius:50%;flex:none}
.trow .n{flex:1;min-width:0}
.trow .n b{display:block;font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .n small{display:block;color:var(--dim);font-size:12.5px}
.rep{padding:14px;margin-bottom:10px}
.rep .rt{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rep .rt b{font-weight:700}
.rep .rt .tm{margin-inline-start:auto;font-size:12px;color:var(--dim)}
.rep h5{margin:0 0 4px;font-size:14.5px;font-weight:500}
.rep p{margin:0;font-size:13.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.d-ok{background:#1fae6a}.d-warn{background:#e0a100}.d-fail{background:var(--red)}
details.morning{padding:14px}
details.morning summary{cursor:pointer;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px}
details.morning summary::-webkit-details-marker{display:none}
details.morning summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-inline-end:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);transition:transform .2s}
details.morning[open] summary::after{transform:rotate(-135deg)}
details.morning .body{white-space:pre-line;font-size:14px;color:var(--muted);margin-top:10px}
details.morning a{color:var(--violet)}
.trends{display:flex;flex-direction:column;gap:6px}
.tr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px}
.tr .r{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet-ink);font-weight:700;font-size:12px;flex:none}
.tr .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .v{color:var(--dim);font-size:12.5px;white-space:nowrap;direction:ltr}
/* skeleton + states */
.skel{border-radius:20px;background:linear-gradient(90deg,#eee6f8 0%,#f8f3fd 50%,#eee6f8 100%);background-size:200% 100%;animation:sh 1.2s ease-in-out infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.err{display:flex;gap:10px;align-items:center;padding:14px;border-radius:18px;background:var(--red-soft);color:var(--red);font-size:14px;margin-top:10px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;

.tabs .in{display:flex;width:100%;max-width:620px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;color:var(--dim);font-size:11.5px;font-weight:500;position:relative;border-radius:14px}
.tab svg{width:25px;height:25px}
.tab .ib{position:relative;width:52px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.tab[aria-selected="true"]{color:var(--violet-ink)}
.tab[aria-selected="true"] .ib{background:var(--violet-soft)}
.tab .bd{position:absolute;top:-3px;inset-inline-end:4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--hot);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
body.chat-open .tabs{display:none}
/* login */
.login{position:relative;z-index:1;max-width:420px;margin:0 auto;padding:calc(64px + var(--top)) 24px 40px;text-align:center}
.login img{width:96px;height:96px;border-radius:26px;box-shadow:0 22px 50px -18px rgba(217,16,154,.75)}
.login h1{font-family:var(--display);font-weight:700;font-size:54px;line-height:.95;margin:22px 0 6px}
.login p{color:var(--muted);margin:0 0 18px}
.login input{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line-2);font:inherit;font-size:16px;margin:0 0 12px;direction:ltr;text-align:center;background:#fff}
.login button{width:100%;min-height:52px;border-radius:999px;background:var(--grad);color:#fff;font-weight:700;font-size:17px;box-shadow:0 14px 30px -14px rgba(139,61,255,.95)}
.toast{position:fixed;inset-inline:16px;bottom:calc(92px + var(--bot));margin:auto;max-width:420px;z-index:60;background:var(--ink);color:#fff;border-radius:16px;padding:11px 16px;font-size:14.5px;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
/* inbox */
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;color:var(--muted);white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fchip .count{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--hot);color:#fff;font-size:12px;font-weight:700;margin-inline-start:6px;text-align:center}
.crow{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:8px}
.crow .ca{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--grad);font-size:18px}
.crow .rb{flex:1;min-width:0}
.crow .rt{display:flex;align-items:center;gap:8px}
.crow .rn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .rtime{margin-inline-start:auto;font-size:12px;color:var(--dim);flex:none}
.crow .rl{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;flex:none;font-weight:500}
.t-bot{background:var(--green-soft);color:var(--green)}
.t-wait{background:var(--pink-soft);color:var(--pink)}
.t-human{background:var(--violet-soft);color:var(--violet-ink)}

.ch{padding:calc(10px + var(--top)) 12px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:#fff}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);flex:none}
.back svg{width:18px;height:18px}
.cn{flex:1;min-width:0}
.cn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn small{color:var(--muted);direction:ltr;display:inline-block}
.mode{border-radius:999px;padding:9px 14px;font-size:14px;font-weight:700;flex:none}

.mode.give{background:var(--soft);color:var(--ink);border:1px solid var(--line-2)}

.note{border-radius:12px;padding:10px 12px;font-size:14px}
.note.h{background:var(--pink-soft);border:1px solid #f6b8e2}
.note.o{background:var(--soft);border:1px solid var(--line)}
.note .nr{display:flex;gap:8px;align-items:flex-start}
.note .nr p{margin:0;flex:1}
.note button{background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;font-size:13px;flex:none}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--wall)}
.m{max-width:82%;padding:8px 12px;border-radius:14px;font-size:15px;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 0 rgba(29,16,51,.06)}
.m .who{display:block;font-size:11px;font-weight:700;margin-bottom:2px;color:var(--dim)}
.m .tm{display:block;font-size:11px;color:var(--dim);margin-top:3px;text-align:end}
.m.user{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.m.assistant{align-self:flex-end;background:#f3ecff;border:1px solid #e3d4ff}
.m.daniel{align-self:flex-end;background:#e9f9ef;border:1px solid #bfe9cf}
.m.daniel .who{color:var(--green)}
.m.system{align-self:center;background:transparent;box-shadow:none;color:var(--dim);font-size:12.5px;padding:2px 8px;text-align:center}
.m a{color:var(--violet)}
.tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tools span{font-size:11px;background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;color:var(--muted)}
.merr{color:var(--red);font-size:12px;font-weight:700;display:block;margin-top:4px}
.compose{border-top:1px solid var(--line);padding:8px 10px calc(8px + var(--bot));background:#fff}
.hint{font-size:12.5px;color:var(--muted);margin:0 4px 6px}
.cr{display:flex;gap:8px;align-items:flex-end}
.cr textarea{flex:1;resize:none;border:1px solid var(--line-2);border-radius:20px;padding:10px 14px;font:inherit;font-size:16px;max-height:140px;background:var(--wall);color:var(--ink)}
.send{background:var(--grad);color:#fff;border-radius:999px;padding:11px 18px;font-weight:700;flex:none}
.send:disabled{opacity:.5}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

<body>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';

  brief: '<rect x="3.5" y="7.5" width="17" height="12" rx="2.5"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"/><path d="M3.5 12.5h17"/>',

  play: '<path d="M8 6.5v11l9-5.5z"/>',
  mute: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 4.5 5M20.5 9.5 16 14.5"/>',
  sound: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/>'
};
function toast(t){ var x = document.getElementById('toast'); x.textContent = t; x.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ x.classList.remove('on'); }, 2800); }
function call(base, path, opts){
  opts = opts || {};
  return fetch(base + path, { method: opts.method || 'GET', headers: { 'x-bench-key': S.key, 'content-type': 'application/json' }, body: opts.body ? JSON.stringify(opts.body) : undefined })
    .then(function(r){
      if (r.status === 401){ store(KEY_NAME, null); S.key = null; renderLogin('הקוד לא נכון או שהוחלף'); throw new Error('unauthorized'); }
      return r.json().then(function(j){ j = j || {}; j.__status = r.status; if (!r.ok && !j.error) j.error = 'שגיאה ' + r.status; return j; });
    });

var DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
var DLETTER = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
var TYPE = { post: 'פוסט', carousel: 'קרוסלה', story: 'סטורי', reel: 'ריל', video_edit: 'עריכת וידאו', website: 'אתר', presentation: 'מצגת', document: 'מסמך', agent_prompt: 'סוכן', other: 'משימה' };
var BRAND = { danielor: ['Danielor', 'var(--b-d)'], ac_he: ['AC עברית', 'var(--b-he)'], ac_en: ['AC English', 'var(--b-en)'], general: ['כללי', 'var(--b-g)'] };
function brandOf(t){ return BRAND[t.brand] || BRAND.general; }
var ilParts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });

  var p = {}; ilParts.formatToParts(new Date(iso)).forEach(function(x){ p[x.type] = x.value; });
  var d = new Date(Date.UTC(+p.year, +p.month - 1, +p.day));
  return { dow: d.getUTCDay(), dm: p.day.replace(/^0/, '') + '.' + p.month.replace(/^0/, ''), hm: p.hour + ':' + p.minute, h: +p.hour, ymd: p.year + '-' + p.month + '-' + p.day };

function whenLabel(t){ if (!t.publish_at) return 'עוד בלי מועד'; var x = il(t.publish_at); return DAYS[x.dow] + ' ' + x.dm + ', ' + x.hm; }

function linkify(text, node){ var re = /(https?:\/\/[^\s]+)/g, last = 0, m; while ((m = re.exec(text))){ if (m.index > last) node.appendChild(document.createTextNode(text.slice(last, m.index))); node.appendChild(el('a', { href: m[1], target: '_blank', rel: 'noopener', text: m[1] })); last = m.index + m[1].length; } if (last < text.length) node.appendChild(document.createTextNode(text.slice(last))); }

/* ---------- task logic ---------- */
function needsYou(t){
  if (t.daniel_approved) return false;
  if (t.status === 'awaiting_daniel') return true;
  if (t.status === 'qa' && (t.media || t.output_url)) return true;
  // a paid generation blocks only once it has a publish date; undated ideas wait in the team tab
  return !!(t.needs_paid_generation && t.publish_at && (t.status === 'new' || t.status === 'with_claude'));
}
function whyYou(t){
  if (t.status === 'awaiting_daniel') return 'מוכן, מחכה לאישור שלך';

/* ---------- team ---------- */

/* ---------- inbox ---------- */
var STATE = { bot: ['הסוכן עונה', 't-bot'], waiting: ['מחכה לך', 't-wait'], human: ['אתה בשיחה', 't-human'], human_temp: ['אתה בשיחה', 't-human'] };

var WHO = { user: 'לקוח', assistant: 'הסוכן', daniel: 'אתה' };
var CATS = { trends: 'טרנדים', music_clip: 'קליפ מוזיקה', business: 'סרטונים לעסק', explainer: 'סרטוני הסבר', launch: 'דפי נחיתה', showreel: 'השואוריל' };
function sysText(t){ t = String(t || ''); var m = t.match(/^\[נשלחו דוגמאות: (\w+)\]$/); if (m) return 'נשלחו סרטוני דוגמה: ' + (CATS[m[1]] || m[1]); return t.replace(/^\[|\]$/g, ''); }

function clock(iso){ return new Date(iso).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jerusalem' }); }
function shortAgo(iso){ if (!iso) return ''; var d = (Date.now() - new Date(iso).getTime()) / 1000; if (d < 60) return 'עכשיו'; if (d < 3600) return Math.floor(d / 60) + ' דק׳'; var x = il(iso), td = il(new Date().toISOString()); if (x.ymd === td.ymd) return x.hm; return x.dm; }
var IB = {};
function renderInboxShell(){

}
function renderFilters(){
  var I = S.inbox;
  var waiting = I.convs.filter(function(c){ return c.state === 'waiting'; }).length;
  var mine = I.convs.filter(function(c){ return c.state === 'human' || c.state === 'human_temp'; }).length;
  IB.filters.innerHTML = '';
  [['all', 'הכל', 0], ['waiting', 'מחכים לך', waiting], ['human', 'אתה בשיחה', mine]].forEach(function(f){
    var b = el('button', { class: 'fchip', 'aria-pressed': String(I.filter === f[0]), onclick: function(){ I.filter = f[0]; renderList(); } }, [f[1]]);
    if (f[2]) b.appendChild(el('span', { class: 'count', text: String(f[2]) }));
    IB.filters.appendChild(b);
  });
  var tb = el('button', { class: 'fchip', 'aria-pressed': String(I.showTests), text: 'גם שיחות בדיקה', onclick: function(){ I.showTests = !I.showTests; refreshList(); } });
  IB.filters.appendChild(tb);
}
function renderList(){
  var I = S.inbox; renderFilters(); IB.rows.innerHTML = '';
  var items = I.convs.filter(function(c){ if (I.filter === 'waiting') return c.state === 'waiting'; if (I.filter === 'human') return c.state === 'human' || c.state === 'human_temp'; return true; });
  if (!items.length){ IB.rows.appendChild(el('div', { class: 'card empty' }, [el('b', { text: I.convs.length ? 'אין כאן שיחות' : 'עוד אין שיחות' }), I.convs.length ? 'נסה סינון אחר.' : 'כשלקוח יכתוב ל-Danielor, השיחה תופיע כאן.'])); return; }
  items.forEach(function(c){
    var st = STATE[c.state] || STATE.bot;
    var lastTxt = c.last ? ((c.last.role === 'assistant' ? 'הסוכן: ' : c.last.role === 'daniel' ? 'אתה: ' : '') + c.last.text) : '';
    IB.rows.appendChild(el('button', { class: 'crow', onclick: function(){ openConv(c.id); } }, [
      el('div', { class: 'ca', 'aria-hidden': 'true', text: (c.name || '?').trim().charAt(0) }),
      el('div', { class: 'rb' }, [
        el('div', { class: 'rt' }, [el('span', { class: 'rn', text: (c.handoff && c.handoff.urgent ? 'דחוף · ' : '') + c.name }), el('span', { class: 'tag ' + st[1], text: st[0] }), el('span', { class: 'rtime', text: shortAgo(c.last ? c.last.at : c.updated_at) })]),
        el('div', { class: 'rl', text: lastTxt })
      ])

  });
}
function refreshList(){
  var I = S.inbox;
  return call(WA, '/inbox/list' + (I.showTests ? '?all=1' : '')).then(function(j){ if (j.error) return toast(j.error); I.convs = j.conversations || []; I.loaded = true; renderList(); setBadges(); }).catch(function(){});
}
function openConv(id){
  var I = S.inbox; I.openId = id; I.conv = null; I.lastMsgId = null;
  document.body.classList.add('chat-open'); pauseAll();
  if (IB.chat) IB.chat.remove();
  IB.chat = el('section', { class: 'chat', 'aria-label': 'שיחה', role: 'dialog' }, [el('div', { class: 'empty', style: 'margin:auto', text: 'טוען…' })]);
  document.body.appendChild(IB.chat);
  loadConv(true);
  clearInterval(S.timers.conv); S.timers.conv = setInterval(function(){ if (!document.hidden) loadConv(false); }, 4000);
}
function closeConv(){
  var I = S.inbox; I.openId = null; I.conv = null; clearInterval(S.timers.conv);
  if (IB.chat){ IB.chat.remove(); IB.chat = null; }
  document.body.classList.remove('chat-open'); refreshList();
}
function loadConv(first){
  var I = S.inbox, id = I.openId; if (!id) return;
  return call(WA, '/inbox/conv?id=' + encodeURIComponent(id)).then(function(j){
    if (id !== I.openId) return;
    if (j.error){ toast(j.error); return; }
    var lastId = j.messages.length ? j.messages[j.messages.length - 1].id : 0;
    var changed = first || !I.conv || lastId !== I.lastMsgId || j.conversation.state !== I.conv.conversation.state || j.handoffs.length !== I.conv.handoffs.length;
    I.conv = j; I.lastMsgId = lastId;

}
function renderConv(first){
  var I = S.inbox, j = I.conv, c = j.conversation, box = IB.chat; if (!box) return;
  var oldTa = box.querySelector('textarea'); var draft = oldTa ? oldTa.value : '';
  var oldMsgs = box.querySelector('.msgs'); var atBottom = !oldMsgs || (oldMsgs.scrollHeight - oldMsgs.scrollTop - oldMsgs.clientHeight < 80);
  box.innerHTML = '';
  var human = c.state === 'human' || c.state === 'human_temp';
  var modeBtn = human ? el('button', { class: 'mode give', text: 'החזר לסוכן', onclick: function(){ setMode('bot'); } }) : el('button', { class: 'mode take', text: 'אני נכנס לשיחה', onclick: function(){ setMode('human'); } });
  box.appendChild(el('header', { class: 'ch' }, [
    el('button', { class: 'back', 'aria-label': 'חזרה לרשימה', html: svg(IC.back), onclick: closeConv }),
    el('div', { class: 'cn' }, [el('b', { text: c.name }), c.phone ? el('small', { text: phoneFmt(c.phone) }) : el('small', { text: 'שיחת בדיקה' })]),
    modeBtn
  ]));
  var notes = el('div', { class: 'notes' });
  j.handoffs.forEach(function(h){
    notes.appendChild(el('div', { class: 'note h' }, [el('div', { class: 'nr' }, [
      el('p', {}, [el('b', { text: (h.urgency === 'דחוף' ? 'דחוף · ' : '') + 'הסוכן העביר אליך: ' }), h.reason + (h.summary ? ' · ' + h.summary : '')]),
      el('button', { text: 'טופל', onclick: function(){ call(WA, '/inbox/handoff-done', { method: 'POST', body: { id: h.id } }).then(function(){ toast('סומן כטופל'); loadConv(true); refreshList(); loadHome(); }); } })
    ])]));
  });
  if (j.order){ var o = j.order; notes.appendChild(el('div', { class: 'note o', text: 'הזמנה: ' + o.product + ' · ₪' + o.price_ils + ' ' + (o.vat === 'לפני' ? '+ מע״מ' : 'כולל מע״מ') + ' · ' + ({ draft: 'טיוטה', confirmed: 'אושרה', payment_requested: 'מחכה לתשלום', paid: 'שולם' }[o.status] || o.status) + (o.missing ? ' · חסר: ' + o.missing : '') })); }
  if (notes.childNodes.length) box.appendChild(notes);
  var msgs = el('div', { class: 'msgs', role: 'log', 'aria-live': 'polite' });
  j.messages.forEach(function(m){
    if (m.role === 'system'){ msgs.appendChild(el('div', { class: 'm system', text: sysText(m.text) })); return; }
    var b = el('div', { class: 'm ' + m.role }, [el('span', { class: 'who', text: WHO[m.role] || '' })]);
    var body = el('span'); linkify(String(m.text || ''), body); b.appendChild(body);
    if (m.file && m.kind === 'image') b.appendChild(el('div', {}, [el('a', { href: m.file, target: '_blank', rel: 'noopener', text: 'פתח תמונה' })]));
    if (m.tools && m.tools.length){ var tl = el('div', { class: 'tools' }); m.tools.forEach(function(n){ if (TOOLS[n]) tl.appendChild(el('span', { text: TOOLS[n] })); }); if (tl.childNodes.length) b.appendChild(tl); }
    if (m.error) b.appendChild(el('span', { class: 'merr', text: 'לא נשלח ללקוח' }));

  var ta = el('textarea', { rows: '1', 'aria-label': 'הודעה ללקוח', placeholder: 'כתוב ללקוח…' }); ta.value = draft;
  var send = el('button', { class: 'send', text: 'שלח' });
  function grow(){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; }
  ta.addEventListener('input', grow);
  ta.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width:900px)').matches){ e.preventDefault(); send.click(); } });
  send.addEventListener('click', function(){
    var text = ta.value.trim(); if (!text || I.sending) return;

}
function setMode(mode){

function startInboxTimer(){ clearInterval(S.timers.list); S.timers.list = setInterval(function(){ if (!document.hidden && S.tab === 'inbox') refreshList(); }, 8000); }

/* ---------- start ---------- */
function stopTimers(){ for (var k in S.timers) clearInterval(S.timers[k]); }
function start(){
